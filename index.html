<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - UAGRM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: #fff;
            display: flex;
        }
        .left-section {
            flex: 0 0 60%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: #fff;
            min-width: 400px;
        }
        .left-section img {
            max-width: 350px;
            height: auto;
        }
        .right-section {
            flex: 0 0 40%;
            background: #094173;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-width: 300px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 30px 25px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }
        .logo img {
            max-width: 160px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .logo h1 {
            font-size: 18px;
            color: #0d47a1;
            margin-top: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        h2 {
            font-size: 24px;
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .welcome-text {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.4;
        }
        .alert, .resultado {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            width: 100%;
        }
        .resultado.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .resultado.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .form-group {
            margin-bottom: 15px;
            position: relative;
            width: 100%;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-size: 13px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            padding-left: 42px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #094173;
            background: white;
            box-shadow: 0 0 0 3px rgba(9, 65, 115, 0.1);
        }
        .form-icon {
            position: absolute;
            left: 13px;
            top: 38px;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            pointer-events: none;
        }
        .form-icon svg {
            width: 16px;
            height: 16px;
            stroke: #094173;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .password-toggle {
            position: absolute;
            right: 13px;
            top: 38px;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
        }
        .password-toggle svg {
            width: 16px;
            height: 16px;
            stroke: #888;
            fill: none;
            stroke-width: 1.8;
            transition: stroke 0.2s;
        }
        .password-toggle:hover svg { stroke: #094173; }
        .forgot-password {
            text-align: right;
            margin-top: 5px;
            margin-bottom: 18px;
            width: 100%;
        }
        .forgot-password a {
            color: #094173;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        .forgot-password a:hover { text-decoration: underline; }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #dc0000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-login:hover {
            background: #b80000;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 0, 0, 0.25);
        }
        .btn-login:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }
        .footer {
            text-align: center;
            margin-top: 18px;
            color: #999;
            font-size: 11px;
            width: 100%;
        }
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .left-section { flex: 0 0 auto; padding: 30px; min-height: 35vh; min-width: auto; }
            .right-section { flex: 0 0 auto; padding: 30px 20px; min-height: 65vh; min-width: auto; }
            .login-card { padding: 25px 20px; max-width: 320px; }
        }
        @media (max-width: 600px) {
            .left-section img { max-width: 180px; }
            .login-card { max-width: 100%; padding: 20px 15px; }
            h2 { font-size: 22px; }
            .form-group input { padding: 10px 12px; padding-left: 38px; }
        }
    </style>
</head>
<body>
    <div class="left-section">
        <img src="public/imagenes2.png/uagrm-logo.jpg" alt="UNIVERSIDAD AUTÓNOMA GABRIEL RENÉ MORENO">
    </div>

    <div class="right-section">
        <div class="login-card">
            <div class="logo">
                <img src="public/imagenes2.png/ULTRAPROFONDO.png" alt="UAGRM">
            </div>

            <h2>Iniciar sesión</h2>
            <p class="welcome-text">Bienvenido de nuevo. Por favor, ingresa tus credenciales</p>

            <div id="resultado" class="alert"></div>

            <form id="registroForm">
                <div class="form-group">
                    <label for="registro">Código de usuario</label>
                    <span class="form-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12z"/><path d="M12 14.4c-4.8 0-8.4 2.4-8.4 5.4v1.2h16.8v-1.2c0-3-3.6-5.4-8.4-5.4z"/></svg>
                    </span>
                    <input type="text" id="registro" name="registro" placeholder="Código de usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <span class="form-icon">
                        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                    <button type="button" class="password-toggle" id="togglePass">
                        <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>

                <div class="forgot-password">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-login" id="submitBtn">
                    <span class="btn-text">Iniciar Sesión</span>
                    <span class="btn-loader" style="display:none">Verificando...</span>
                </button>

                <p class="footer" id="estadoMsg"></p>
            </form>
        </div>
    </div>

<script src="assets/main.js"></script>
</body>
</html>
